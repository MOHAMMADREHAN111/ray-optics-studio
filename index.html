<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ray Optics Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --panel:#12151d;
    --panel-2:#171b26;
    --rail:#232a3a;
    --border:#232938;
    --text:#e4e8f1;
    --muted:#8891a3;
    --cyan:#6fd8ff;
    --amber:#ffcf6b;
    --red:#ff7676;
    --green:#4be89a;
    --violet:#b39dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:1180px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:16px;}

  #errorBanner{
    display:none;
    background:#3a1414;border:1px solid #7a2a2a;color:#ffb3b3;
    padding:10px 14px;border-radius:8px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;white-space:pre-wrap;
  }

  .titlebar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .titlebar h1{margin:0;font-size:23px;font-weight:700;}
  .titlebar h1 span{color:var(--cyan);}
  .titlebar .sub{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:0.6px;}

  .tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--border);}
  .tab{appearance:none;border:none;background:transparent;color:var(--muted);padding:9px 16px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .tab.active{background:var(--rail);color:var(--cyan);}
  .tab .key{color:inherit;opacity:.5;font-family:'IBM Plex Mono',monospace;font-size:10px;margin-left:6px;}

  .main{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .stage{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;flex:1 1 640px;}
  canvas{display:block;width:100%;height:auto;border-radius:9px;background:#0d1017;cursor:grab;}
  canvas:active{cursor:grabbing;}
  .blurb{font-size:12.5px;color:var(--muted);padding:12px 4px 2px;line-height:1.55;}

  .panel{flex:0 0 320px;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:17px;}
  .card h2{margin:0 0 13px;font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:600;}

  .typetoggle{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .typebtn{flex:1 1 45%;appearance:none;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);padding:8px 4px;border-radius:8px;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;}
  .typebtn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(111,216,255,0.09);}

  .checkbox-field{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;cursor:pointer;color:var(--text);user-select:none;}
  .checkbox-field input{accent-color:var(--cyan);width:16px;height:16px;cursor:pointer;}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field label b{color:var(--cyan);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--cyan);height:4px;}

  .resetbtn{width:100%;margin-top:6px;appearance:none;border:1px solid var(--border);background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;}
  .resetbtn:hover{color:var(--text);border-color:var(--muted);}

  .readout{display:grid;grid-template-columns:1fr auto;row-gap:8px;column-gap:10px;font-size:12.5px;}
  .readout .k{color:var(--muted);}
  .readout .v{font-family:'IBM Plex Mono',monospace;color:var(--text);text-align:right;}
  .readout .v.hl{color:var(--cyan);}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .badge{font-size:10px;font-weight:700;letter-spacing:0.5px;padding:4px 8px;border-radius:999px;font-family:'IBM Plex Mono',monospace;}
  .badge.real{background:rgba(75,232,154,0.14);color:var(--green);}
  .badge.virtual{background:rgba(255,118,118,0.14);color:var(--red);}
  .badge.up{background:rgba(179,157,255,0.14);color:var(--violet);}
  .badge.inv{background:rgba(255,207,107,0.14);color:var(--amber);}
  .badge.warn{background:rgba(255,118,118,0.2);color:var(--red);}

  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;}

  footer{text-align:center;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;padding-top:4px;display:flex;flex-direction:column;gap:6px;}
  .credit{color:var(--cyan);font-weight:600;letter-spacing:1.5px;font-size:11.5px;}
</style>
</head>
<body>
<div class="app">
  <div id="errorBanner"></div>

  <div class="titlebar">
    <div>
      <h1>Ray Optics <span>Studio</span></h1>
      <div class="sub">MIRRORS · LENSES · PRISMS · SLAB — INTERACTIVE BENCH</div>
    </div>
    <div class="tabs">
      <button class="tab" data-mode="mirror">Mirror<span class="key">1</span></button>
      <button class="tab" data-mode="lens">Lens<span class="key">2</span></button>
      <button class="tab" data-mode="prism">Prism<span class="key">3</span></button>
      <button class="tab" data-mode="slab">Glass Slab<span class="key">4</span></button>
    </div>
  </div>

  <div class="main">
    <div class="stage">
      <canvas id="cv" width="880" height="500"></canvas>
      <div class="blurb" id="blurb"></div>
    </div>

    <div class="panel">
      <div class="card">
        <h2>Controls</h2>
        <div id="controlsBody"></div>
        <button class="resetbtn" id="resetBtn" type="button">Reset this element</button>
      </div>

      <div class="card">
        <h2>Readout</h2>
        <div class="readout" id="readout"></div>
        <div class="badges" id="badges"></div>
      </div>

      <div class="card">
        <h2>Legend</h2>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>

  <footer>
    <div>drag elements or object on the bench, or use sliders — press 1 / 2 / 3 / 4 to switch modes</div>
    <div class="credit">ENGINEERED BY REHAN</div>
  </footer>
</div>

<script>
window.onerror = function(msg, src, line, col, err){
  var b = document.getElementById('errorBanner');
  b.style.display = 'block';
  b.textContent = 'Script error: ' + msg + '  (line ' + line + ')';
  return false;
};

(function(){
"use strict";

var D2R = Math.PI/180, R2D = 180/Math.PI;
var PX_TO_CM = 0.1;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
function scl(a,s){ return {x:a.x*s, y:a.y*s}; }
function unit(a){ var l = Math.hypot(a.x,a.y) || 1; return {x:a.x/l, y:a.y/l}; }

function makeEl(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

// ---------- physics formulas ----------
function mirrorCalc(uPx, fPx){
  if (Math.abs(uPx-fPx) < 1e-6 || Math.abs(uPx) < 1e-6) return {v:Infinity, m:0};
  var v = (fPx*uPx)/(uPx-fPx);
  return {v:v, m:-v/uPx};
}

function lensCalc(uPx, fPx){
  if (Math.abs(uPx+fPx) < 1e-6 || Math.abs(uPx) < 1e-6) return {v:Infinity, m:0};
  var v = (fPx*uPx)/(uPx+fPx);
  return {v:v, m:v/uPx};
}

function prismCalc(iDeg, ADeg, n){
  var i = iDeg*D2R, A = ADeg*D2R;
  var s1 = Math.sin(i)/n;
  if (Math.abs(s1) > 1) return {tir:true};
  var r1 = Math.asin(s1);
  var r2 = A - r1;
  var s2 = n*Math.sin(r2);
  if (Math.abs(s2) > 1) return {tir:true, r1:r1, r2:r2};
  var e = Math.asin(s2);
  var delta = i + e - A;
  return {tir:false, i:i, r1:r1, r2:r2, e:e, delta:delta};
}

function slabCalc(iDeg, tPx, n){
  var i1 = iDeg * D2R;
  var s2 = Math.sin(i1) / n;
  if (Math.abs(s2) > 1) return {tir:true};
  var r1 = Math.asin(s2);
  var shift = tPx * Math.sin(i1 - r1) / Math.cos(r1);
  return {tir:false, r1:r1, shift:shift};
}

// ---------- state ----------
var state = { mode:'mirror', showOnCanvas:true };
var mirror = { type:'concave', fMag:120, objectX:200, x:660, oh:70 };
var lens   = { type:'convex',  fMag:130, objectX:200, x:460, oh:70 };
var prism  = { A:60, n:1.5, i:45, x:460 };
var slab   = { thickness:140, n:1.5, i:40, x:460 };
var CENTER_Y = 250;

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var controlsBody = document.getElementById('controlsBody');
var readoutEl = document.getElementById('readout');
var badgesEl = document.getElementById('badges');
var legendEl = document.getElementById('legend');
var blurbEl = document.getElementById('blurb');

function formatCm(px){
  var cm = px * PX_TO_CM;
  return cm.toFixed(1) + ' cm (' + Math.round(px) + 'px)';
}

// ---------- controls building ----------
function sliderField(labelText, displayVal, min, max, step, val, onInput){
  var field = makeEl('div','field');
  var label = makeEl('label','', '<span>'+labelText+'</span><b>'+displayVal+'</b>');
  field.appendChild(label);
  var input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = val;
  var bTag = label.querySelector('b');
  input.addEventListener('input', function(e){
    var v = parseFloat(e.target.value);
    var out = onInput(v);
    bTag.textContent = (out !== undefined) ? out : v;
  });
  field.appendChild(input);
  return field;
}

function buildControls(){
  controlsBody.innerHTML = '';

  var cbLabel = makeEl('label', 'checkbox-field');
  var cbInput = document.createElement('input');
  cbInput.type = 'checkbox';
  cbInput.checked = state.showOnCanvas;
  cbInput.addEventListener('change', function(e){
    state.showOnCanvas = e.target.checked;
    draw();
  });
  cbLabel.appendChild(cbInput);
  cbLabel.appendChild(document.createTextNode(' Display details on element'));
  controlsBody.appendChild(cbLabel);

  if (state.mode === 'mirror'){
    var toggle = makeEl('div','typetoggle');
    ['concave','convex'].forEach(function(t){
      var b = makeEl('button', 'typebtn' + (mirror.type===t ? ' active':''), t.charAt(0).toUpperCase()+t.slice(1));
      b.type = 'button';
      b.addEventListener('click', function(){ mirror.type = t; buildControls(); draw(); });
      toggle.appendChild(b);
    });
    controlsBody.appendChild(toggle);
    controlsBody.appendChild(sliderField('Focal length |f|', formatCm(mirror.fMag), 40, 240, 5, mirror.fMag, function(v){ mirror.fMag=v; draw(); return formatCm(v); }));
    var maxDist = mirror.x - 80;
    controlsBody.appendChild(sliderField('Object distance', formatCm(mirror.x-mirror.objectX), 40, maxDist, 5, mirror.x-mirror.objectX, function(v){ mirror.objectX = mirror.x - v; draw(); return formatCm(v); }));
  } 
  else if (state.mode === 'lens'){
    var toggle2 = makeEl('div','typetoggle');
    ['convex','concave','biconvex','biconcave','plano-convex','plano-concave','mono-convex','mono-concave'].forEach(function(t){
      var b = makeEl('button', 'typebtn' + (lens.type===t ? ' active':''), t.replace('-', ' '));
      b.type = 'button';
      b.addEventListener('click', function(){ lens.type = t; buildControls(); draw(); });
      toggle2.appendChild(b);
    });
    controlsBody.appendChild(toggle2);
    controlsBody.appendChild(sliderField('Focal length |f|', formatCm(lens.fMag), 40, 240, 5, lens.fMag, function(v){ lens.fMag=v; draw(); return formatCm(v); }));
    var maxDist2 = lens.x - 80;
    controlsBody.appendChild(sliderField('Object distance', formatCm(lens.x-lens.objectX), 40, maxDist2, 5, lens.x-lens.objectX, function(v){ lens.objectX = lens.x - v; draw(); return formatCm(v); }));
  } 
  else if (state.mode === 'prism'){
    controlsBody.appendChild(sliderField('Apex angle A', prism.A+'\u00B0', 20, 90, 1, prism.A, function(v){ prism.A=v; draw(); return Math.round(v)+'\u00B0'; }));
    controlsBody.appendChild(sliderField('Refractive index n', prism.n.toFixed(2), 1.10, 2.50, 0.01, prism.n, function(v){ prism.n=v; draw(); return v.toFixed(2); }));
    controlsBody.appendChild(sliderField('Incidence angle i', prism.i+'\u00B0', 0, 89, 1, prism.i, function(v){ prism.i=v; draw(); return Math.round(v)+'\u00B0'; }));
  } 
  else if (state.mode === 'slab'){
    controlsBody.appendChild(sliderField('Thickness t', formatCm(slab.thickness), 60, 220, 5, slab.thickness, function(v){ slab.thickness=v; draw(); return formatCm(v); }));
    controlsBody.appendChild(sliderField('Refractive index n', slab.n.toFixed(2), 1.10, 2.50, 0.01, slab.n, function(v){ slab.n=v; draw(); return v.toFixed(2); }));
    controlsBody.appendChild(sliderField('Incidence angle i', slab.i+'\u00B0', 0, 85, 1, slab.i, function(v){ slab.i=v; draw(); return Math.round(v)+'\u00B0'; }));
  }
}

document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click', function(){ setMode(btn.getAttribute('data-mode')); });
});
document.addEventListener('keydown', function(e){
  if (e.key==='1') setMode('mirror');
  if (e.key==='2') setMode('lens');
  if (e.key==='3') setMode('prism');
  if (e.key==='4') setMode('slab');
});
document.getElementById('resetBtn').addEventListener('click', function(){
  if (state.mode==='mirror'){ mirror.type='concave'; mirror.fMag=120; mirror.objectX=200; }
  if (state.mode==='lens'){ lens.type='convex'; lens.fMag=130; lens.objectX=200; }
  if (state.mode==='prism'){ prism.A=60; prism.n=1.5; prism.i=45; }
  if (state.mode==='slab'){ slab.thickness=140; slab.n=1.5; slab.i=40; }
  buildControls(); draw();
});

function setMode(m){
  state.mode = m;
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-mode')===m);
  });
  buildControls();
  draw();
}

// ---------- dragging on canvas ----------
var dragging = false;
cv.addEventListener('mousedown', function(){ dragging = true; });
window.addEventListener('mouseup', function(){ dragging = false; });
cv.addEventListener('mousemove', function(e){
  if (!dragging) return;
  var rect = cv.getBoundingClientRect();
  var sx = cv.width/rect.width, sy = cv.height/rect.height;
  var mx = (e.clientX-rect.left)*sx, my = (e.clientY-rect.top)*sy;
  if (state.mode==='mirror'){ mirror.objectX = clamp(mx, 50, mirror.x-70); buildControls(); }
  else if (state.mode==='lens'){ lens.objectX = clamp(mx, 50, lens.x-70); buildControls(); }
  else if (state.mode==='prism'){ prism.i = clamp(90-(my-80)/3.5, 0, 89); buildControls(); }
  else if (state.mode==='slab'){ slab.i = clamp((my-120)/3.5, 0, 85); buildControls(); }
  draw();
});

// ---------- drawing helpers ----------
function axis(){
  ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,CENTER_Y); ctx.lineTo(880,CENTER_Y); ctx.stroke();
}
function gridBg(){
  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
